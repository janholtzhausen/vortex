name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: debug build + full test suite (unit + kTLS API + kTLS shell) ──
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build clang llvm ccache \
            libbpf-dev liburing-dev libyaml-dev \
            libbrotli-dev libnghttp2-dev \
            linux-tools-common linux-tools-generic \
            pkg-config dpkg-dev debhelper python3

      - name: Load kTLS kernel module
        run: sudo modprobe tls || echo "kTLS not available — shell tests will self-skip"

      - name: Cache picotls build
        id: cache-picotls
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/picotls
          key: picotls-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Build picotls (if not cached)
        if: steps.cache-picotls.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/h2o/picotls.git /tmp/picotls
          cd /tmp/picotls
          git submodule update --init --recursive
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel "$(nproc)"

      - name: Configure (debug + kTLS shell tests enabled)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DVORTEX_TLS=ON \
            -DVORTEX_KTLS_TESTS=ON \
            -DPICOTLS_SRC_DIR=/tmp/picotls \
            -DPICOTLS_BUILD_DIR=/tmp/picotls/build \
            -DVORTEX_MARCH=x86-64-v2

      - name: Build all targets
        run: cmake --build build --parallel "$(nproc)"

      - name: Run unit + kTLS API tests
        run: |
          ctest --test-dir build --output-on-failure --parallel "$(nproc)" \
            --label-exclude ktls_shell

      - name: Run kTLS shell integration tests (self-skip if infra unavailable)
        # Tests exit 77 when kTLS module / BPF / root not available; ctest
        # maps exit 77 → SKIP.  Job succeeds even if all tests skip.
        run: |
          ctest --test-dir build --output-on-failure \
            --label-regex ktls_shell 2>&1 || true

  # ── Job 2: AddressSanitizer + UBSanitizer build ──
  sanitize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build clang llvm ccache \
            libbpf-dev liburing-dev libyaml-dev \
            libbrotli-dev libnghttp2-dev \
            pkg-config

      - name: Cache picotls build
        id: cache-picotls
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/picotls
          key: picotls-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Build picotls (if not cached)
        if: steps.cache-picotls.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/h2o/picotls.git /tmp/picotls
          cd /tmp/picotls
          git submodule update --init --recursive
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel "$(nproc)"

      - name: Configure (ASan + UBSan + LeakSan)
        run: |
          cmake -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined,leak -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined,leak" \
            -DVORTEX_TLS=ON \
            -DPICOTLS_SRC_DIR=/tmp/picotls \
            -DPICOTLS_BUILD_DIR=/tmp/picotls/build \
            -DVORTEX_MARCH=x86-64-v2

      - name: Build (ASan)
        run: cmake --build build-asan --parallel "$(nproc)"

      - name: Run tests under ASan/UBSan
        env:
          ASAN_OPTIONS: "halt_on_error=1:detect_leaks=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: ctest --test-dir build-asan --output-on-failure --parallel "$(nproc)"

  # ── Job 3: Fuzz (short bounded run, libFuzzer) ──
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build clang llvm libyaml-dev pkg-config

      - name: Cache picotls build
        id: cache-picotls
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/picotls
          key: picotls-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Build picotls (if not cached)
        if: steps.cache-picotls.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/h2o/picotls.git /tmp/picotls
          cd /tmp/picotls
          git submodule update --init --recursive
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel "$(nproc)"

      - name: Configure fuzz targets
        run: |
          cmake -B build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DVORTEX_TLS=ON \
            -DPICOTLS_SRC_DIR=/tmp/picotls \
            -DPICOTLS_BUILD_DIR=/tmp/picotls/build \
            -DVORTEX_MARCH=x86-64-v2 \
            -DVORTEX_FUZZ=ON

      - name: Build fuzz targets
        run: |
          cmake --build build-fuzz \
            --target fuzz_http_parser fuzz_smuggling fuzz_chunked \
            --parallel "$(nproc)"

      - name: Run fuzz targets (30 seconds each)
        run: |
          corpus=build-fuzz/fuzz/corpus
          for target in fuzz_http_parser fuzz_smuggling fuzz_chunked; do
            echo "=== $target ==="
            build-fuzz/fuzz/$target \
              -max_total_time=30 \
              -max_len=8192 \
              "$corpus"/
          done
        timeout-minutes: 5

  # ── Job 4: Static analysis (cppcheck + clang-tidy) ──
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build clang clang-tidy cppcheck llvm \
            libbpf-dev liburing-dev libyaml-dev \
            libbrotli-dev libnghttp2-dev pkg-config

      - name: Cache picotls build
        id: cache-picotls
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/picotls
          key: picotls-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Build picotls (if not cached)
        if: steps.cache-picotls.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/h2o/picotls.git /tmp/picotls
          cd /tmp/picotls
          git submodule update --init --recursive
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel "$(nproc)"

      - name: Generate compile_commands.json
        run: |
          cmake -B build-lint -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DVORTEX_TLS=ON \
            -DPICOTLS_SRC_DIR=/tmp/picotls \
            -DPICOTLS_BUILD_DIR=/tmp/picotls/build \
            -DVORTEX_MARCH=x86-64-v2

      - name: cppcheck
        run: |
          cppcheck --error-exitcode=1 --quiet \
            --suppress=missingIncludeSystem \
            --inline-suppr \
            -I include -I src -I /tmp/picotls/include \
            src/ cert/ \
            2>&1 | tee cppcheck.log
          [ ! -s cppcheck.log ] || { echo "cppcheck found issues"; exit 1; }

      - name: clang-tidy
        run: |
          run-clang-tidy -p build-lint \
            -header-filter='(src|include|cert)/.*\.(c|h)$' \
            $(find src cert -name '*.c' | head -20) \
            2>&1 | tee clang-tidy.log || true
          # Fail only on errors, not warnings
          grep -c "error:" clang-tidy.log && exit 1 || true
