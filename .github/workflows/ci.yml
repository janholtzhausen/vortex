name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build clang llvm ccache \
            libbpf-dev liburing-dev libyaml-dev \
            libbrotli-dev libnghttp2-dev \
            linux-tools-common linux-tools-generic \
            pkg-config \
            dpkg-dev debhelper

      - name: Cache picotls build
        id: cache-picotls
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/picotls
          key: picotls-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Build picotls (if not cached)
        if: steps.cache-picotls.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/h2o/picotls.git /tmp/picotls
          cd /tmp/picotls
          git submodule update --init --recursive
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel "$(nproc)"

      - name: Configure (debug, TLS enabled)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DVORTEX_TLS=ON \
            -DPICOTLS_SRC_DIR=/tmp/picotls \
            -DPICOTLS_BUILD_DIR=/tmp/picotls/build \
            -DVORTEX_MARCH=x86-64-v2

      - name: Build all targets
        run: cmake --build build --parallel "$(nproc)"

      - name: Run all tests
        run: ctest --test-dir build --output-on-failure --parallel "$(nproc)"
