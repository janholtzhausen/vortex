name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build clang llvm ccache \
            libbpf-dev liburing-dev libyaml-dev \
            libbrotli-dev libnghttp2-dev \
            linux-tools-common linux-tools-generic \
            pkg-config \
            dpkg-dev debhelper fakeroot

      - name: Cache picotls build
        id: cache-picotls
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/picotls
          key: picotls-${{ runner.os }}-${{ hashFiles('.github/workflows/release.yml') }}

      - name: Build picotls (if not cached)
        if: steps.cache-picotls.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/h2o/picotls.git /tmp/picotls
          cd /tmp/picotls
          git submodule update --init --recursive
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel "$(nproc)"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Load kTLS kernel module
        run: sudo modprobe tls || echo "kTLS not available — shell tests will self-skip"

      - name: Install runtime test tools
        run: sudo apt-get install -y python3 curl iproute2

      - name: Configure release build
        run: |
          cmake -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DVORTEX_TLS=ON \
            -DVORTEX_KTLS_TESTS=ON \
            -DPICOTLS_SRC_DIR=/tmp/picotls \
            -DPICOTLS_BUILD_DIR=/tmp/picotls/build \
            -DVORTEX_MARCH=x86-64-v2 \
            -DVORTEX_VERSION_OVERRIDE="${{ steps.version.outputs.VERSION }}"

      - name: Build
        run: cmake --build build-release --parallel "$(nproc)"

      - name: Run unit + kTLS API tests
        run: |
          ctest --test-dir build-release --output-on-failure --parallel "$(nproc)" \
            --label-exclude ktls_shell

      - name: Run kTLS shell integration tests (self-skip if infra unavailable)
        run: |
          ctest --test-dir build-release --output-on-failure \
            --label-regex ktls_shell 2>&1 || true

      - name: Assemble .deb package
        run: bash tools/build_deb.sh "${{ steps.version.outputs.VERSION }}"

      - name: Upload .deb as release artifact
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: "vortex_${{ steps.version.outputs.VERSION }}_amd64.deb"
          generate_release_notes: true
          body: |
            ## Installation

            ```sh
            sudo apt-get install -y libbpf1 liburing2 libyaml-0-2 libbrotli1
            sudo dpkg -i vortex_${{ steps.version.outputs.VERSION }}_amd64.deb
            sudo systemctl enable --now vortex
            ```

            See [README.md](README.md) for full documentation.
